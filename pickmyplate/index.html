<!doctype html>                                   <!-- Tells the browser this is a modern HTML5 page -->
<html lang="en-GB">                               <!-- Page language is British English (helps screen readers and the voice) -->
<head>                                            <!-- Start of the page settings (not visible on screen) -->
  <meta charset="utf-8">                          <!-- Use UTF-8 so emoji and all characters display correctly -->
  <meta name="viewport" content="width=device-width, initial-scale=1">  <!-- Makes the page fit phones and tablets -->
  <title>PickMyPlate</title>                      <!-- Name shown on the browser tab -->
  <meta name="description" content="Picture-based lunch choices for children in SEND schools.">  <!-- Short description for search engines -->

  <!-- Bootstrap 5 CSS (layout, buttons, cards, forms) loaded from the jsDelivr CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <!-- Google Fonts: Lexend (headings) and Atkinson Hyperlegible (body text), both designed to be easy to read -->
  <link rel="preconnect" href="https://fonts.googleapis.com">                 <!-- Connect to Google Fonts early (faster) -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>       <!-- Connect to the font file server early -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@500;700&display=swap">

  <!-- Our own custom styles. Loaded AFTER Bootstrap so our rules can override Bootstrap's -->
  <link rel="stylesheet" href="css/style.css">
</head>                                           <!-- End of the page settings -->

<body>                                            <!-- Start of everything visible on screen -->

  <!-- ===== TOP NAVIGATION BAR ===== -->
  <nav class="navbar border-bottom bg-body mb-3">                  <!-- Bootstrap navbar with a bottom border -->
    <div class="container flex-wrap gap-2">                        <!-- Centred container; items wrap on small screens -->
      <a class="navbar-brand d-flex align-items-center gap-2" href="#">  <!-- App name and logo on the left -->
        <img src="img/logo.svg" width="40" height="40" alt="">     <!-- Logo image (decorative, so alt is empty) -->
        <span>                                                     <!-- Wraps the two lines of text -->
          <span class="brand-name d-block">PickMyPlate</span>      <!-- App name -->
          <small class="text-body-secondary brand-tagline">Picture-based lunch choices for SEND schools</small>  <!-- Tagline -->
        </span>
      </a>
      <ul class="nav nav-pills" id="tabs" role="tablist">          <!-- Bootstrap "pills" used as the three main tabs -->
        <li class="nav-item"><button class="nav-link" data-act="view" data-v="choose">Choose lunch</button></li>      <!-- Tab 1: child screen -->
        <li class="nav-item"><button class="nav-link" data-act="view" data-v="kitchen">Kitchen menu</button></li>     <!-- Tab 2: staff screen -->
        <li class="nav-item"><button class="nav-link" data-act="view" data-v="tally">Today's choices</button></li>    <!-- Tab 3: counts -->
      </ul>
    </div>
  </nav>

  <!-- ===== MAIN CONTENT AREA ===== -->
  <div class="container pb-5">                                      <!-- Centred container with padding at the bottom -->
    <!-- Safety warning shown on every screen (Bootstrap "alert") -->
    <div class="alert alert-warning py-2 small" role="note">
      <strong>Prototype:</strong> not yet approved for use with children. Never enter children's names or medical details.
      Always check allergens against the kitchen's official records.
    </div>
    <!-- JavaScript (js/app.js) draws the current screen inside this element -->
    <main id="app" aria-live="polite"></main>
  </div>

  <!-- ===== POP-UP MESSAGE (Bootstrap toast) ===== -->
  <div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3">  <!-- Bottom centre of the screen -->
    <div id="toast" class="toast text-bg-dark border-0" role="status" aria-live="polite" aria-atomic="true">  <!-- The toast box -->
      <div class="toast-body fw-bold" id="toast-text"></div>        <!-- JavaScript puts the message text here -->
    </div>
  </div>

  <!-- Bootstrap's JavaScript (needed for the toast pop-up). Loaded before our own script -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Our app's JavaScript: all the behaviour lives here -->
  <script src="js/app.js"></script>
</body>                                           <!-- End of visible content -->
</html>                                           <!-- End of the page -->
